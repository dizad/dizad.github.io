	<script src="javascript/j04UpperButtons.js"></script>
	<script src="javascript/j05LowerBanner.js"></script>
	<script src="javascript/j06Footnote.js"></script>
	
<!--page script-->

	<script>
	$('document').ready(function(){
	
		//table invokes
		
			// table# 1
			
				// header
				
					insertTableHeader(".tableContainer1", "table1", "Dan's Contact Information", "Name", "E-mail", "Location", "Profession");
					
				// rows
				
					insertTableItem(".table1", "Dan Izad", "dizad87 AT yahoo.com", "Cleveland", "Software Engineer", true); //1
					
			// table# 2
			
				// header
				
					insertTableHeader(".tableContainer2", "table2", "Referee Contact Information", "Name", "E-mail", "Profession", "Acquaintance");
					
				// rows
				
					insertTableItem(".table2", "John Ostroske", "Available upon request", "Java Professor", "Professor for 1 semester", false); //1
					insertTableItem(".table2", "Scott Yamamoto", "Available upon request", "Project Engineer (L4)", "Co-worker for 3 years", false); //2
					insertTableItem(".table2", "Michael Gallagher", "Available upon request", "Professor & Engineer (L3)", "Co-worker for 2 years", false); //3
					insertTableItem(".table2", "Dr.David Wilson", "Available upon request", "CWRU Engineer Professor", "Supervisor for 1 year", false); //4
					insertTableItem(".table2", "Jake Bennett", "Available upon request", "Engineer Supervisor", "Supervisor for 2 years", false); //5
					insertTableItem(".table2", "Dan Griffin", "Available upon request", "Design Engineer (L3)", "Co-worker for 1 year", false); //6
					insertTableItem(".table2", "Sanjin Deric", "Available upon request", "Software Engineer (L2)", "Classmate for 1 year", false); //7
					insertTableItem(".table2", "Dr.Jacqueline Vitali", "Available upon request", "Physics Professor", "Professor and mentor for 2 years", false); //8

		// standard code to build the tables
		
			// variables
			
				var rowAlt = false;	
				var rowAltStyle = "";
			
			// functions
			
				// add table header
				
				function insertTableHeader(entry, tableName, tableTitleEntry, col1Entry, col2Entry, col3Entry, col4Entry){
					$(entry).append(
						'<div class = "addShadow">' +
							'<table class = "' + tableName + '" id = "addTableBlue">'+
								'<tbody>'+
								// header
									'<tr class = "tableHeader">'+
										'<td colspan="5">' + tableTitleEntry + '</td>'+
									'</tr>'+
									
								// sub header
									'<tr class = "tableContentRow" id = "tableSubHeader">'+
										'<td class = "tableContent">' + col1Entry + '</td>'+
										'<td class = "tableContent">' + col2Entry + '</td>'+
										'<td class = "tableContent">' + col3Entry + '</td>'+
										'<td class = "tableContent">' + col4Entry + '</td>'+
									'</tr>'+
								'</tbody>'+
							'</table>' + 
						'</div>' 
					);
				}
						
				// add row items
				
				function insertTableItem(tableEntry, col01Item, col02Item, col03Item, col04Item, isMe){
				
				// swap the alternating row so it shades differently
				
					if (rowAlt == true){ 
						rowAltStyle = 'id = "altRow"'; 
						rowAlt = false;
					}
					else{ 	
						rowAltStyle = ""; 
						rowAlt = true;
					}
					
				// append the row to the table
				
					if(isMe){
						$(tableEntry).append(
							'<tr class = "tableContentRow"' + rowAltStyle + '>'+
								'<td class = "tableContent" style = "text-align: center; width: 200px;"><span class = "propagate">' + col01Item + '</span></td>'+
								'<td class = "tableContent" style = "text-align: center; width: 250px;"><span class = "propagate">' + col02Item + '</span></td>'+
								'<td class = "tableContent" style = "text-align: center; width: 250px;"><span class = "propagate">' + col03Item + '</span></td>'+
								'<td class = "tableContent" style = "text-align: center; width: 250px;"><span class = "propagate">' + col04Item + '</span></td>'+
							'</tr>'																		
						);
					}else {
						$(tableEntry).append(
							'<tr class = "tableContentRow"' + rowAltStyle + '>'+
								'<td class = "tableContent" style = "text-align: center; width: 200px;"><span class = "propagate">' + col01Item + '</span></td>'+
								'<td class = "tableContent" style = "text-align: center; width: 250px;"><span class = "propagate">' + col02Item + '</span></td>'+
								'<td class = "tableContent" style = "text-align: left; width: 250px;"><span class = "propagate">' + col03Item + '</span></td>'+
								'<td class = "tableContent" style = "text-align: left; width: 250px;"><span class = "propagate">' + col04Item + '</span></td>'+
							'</tr>'																		
						);
					}
				}
	});			
	</script>
	
<!--html-->

	<body>
		<table class="tableContainer">

			<!--row# 1: upper banner-->

				<div style = "box-shadow: 0px 0px 16px 0px rgba(0,0,0,0.5); width: 900px; text-align: center; margin: auto;">
					<div class = "upperButtons"></div>

			<!--row# 3: custom content-->
			
				<tr>
					<td colspan="5">					
						<div id = "object" class = "animateDownContainers">
							<div class = "addShadow">
								<div class="infoContainer">
								
								<!--start of custom page content-->
								
								<!--content header-->
								
									<span class = "fontSectionHeader">
										CONTACT:
									</span>
									
									<br><br>
									
								<!--table# 1-->
								
									<span class = "fontBlueBoldTitle">
										<span class = "tab1">
											<span class = "fontSectionHeader">
												DAN IZAD:
											</span>
										</span>
									</span>
									
									<br><br>
										
									<div class = "tableContainer1"></div>
									
									<br>
									
								<!--table# 2-->
								
									<span class = "fontBlueBoldTitle">
										<span class = "tab1">
											<span class = "fontSectionHeader">
												REFERRALS:
											</span>
										</span>
									</span>	
									
									<br><br>  
									<span class = "tab2">The following referrals worked with Dan on a number of projects and agreed to speak on their experiences.</span>
									<br><br>
									<div class = "tableContainer2"></div>
										
								<!--end of custom page content-->
								
								</div>
							<div class = "lowerBanner"></div>
							</div>
							<div class = "footnote"></div>	
						</div>
					</td>
				</tr>
			</tbody>

	</body>
</html>
