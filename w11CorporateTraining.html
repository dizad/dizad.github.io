<html>
<!--tab title-->

	<title>Corporate Training</title>
	
<!--imported styles-->

	<head>
		<script src="javascript/j09HeaderImports.js"></script>
	</head>

<!--imported scripts-->

	<script src='javascript/j01JQuery311.js'></script>
	<script src="javascript/j03UpperBanner.js"></script>
	<script src="javascript/j04UpperButtons.js"></script>
	<script src="javascript/j05LowerBanner.js"></script>
	<script src="javascript/j06Footnote.js"></script>
	
<!--page script-->

	<script>
		$('document').ready(function(){
		
			// table invokes
			
				// table#1
				
					// header
					
						insertTableHeader(".tableContainer1", "table1", "General Corporate Training", "Institute", "Description", "Year", "Duration (days)", "Status");
						
					// rows
					
						insertTableItem(".table1", "TRACOM", "Social Styles", "2016", "1", "Complete"); //1
						insertTableItem(".table1", "Corporate", "Emotional Intelligence", "2016", "1", "Complete"); //2
						insertTableItem(".table1", "Swagelok", "Crucial Conversations", "2016", "1", "Complete"); //3
						insertTableItem(".table1", "Swagelok", "Talking to Distributors", "2016", "1", "Complete"); //4
						insertTableItem(".table1", "ALICE", "Active Response Training", "2016", "1", "Complete"); //5
						insertTableItem(".table1", "Swagelok", "Disciplined Problem Solving", "2016", "1", "Complete"); //6
						insertTableItem(".table1", "Management Concepts", "Project Management", "2015", "3", "Complete"); //7
						insertTableItem(".table1", "Swagelok", "Intro to SAP", "2015", "5", "Complete"); //8
						insertTableItem(".table1", "Rockwell Automation", "RsLogix5000 (ControlLogix)", "2014", "5", "Complete"); //9
						insertTableItem(".table1", "Swagelok", "Lean 101", "2014", "1", "Complete"); //10
						insertTableItem(".table1", "Applied Geometrics", "Intro to GD&T", "2013", "3", "Complete"); //11
						insertTableItem(".table1", "Corporate", "NFPA97", "2012", "3", "Complete"); //12
						insertTableItem(".table1", "Rockwell Automation", "Machine Safety", "2012", "2", "Complete"); //13
						insertTableItem(".table1", "Rockwell Automation", "RsLogix500 (SLC-500)", "2012", "5", "Complete"); //14
						insertTableItem(".table1", "Rockwell Automation", "FactoryTalkView", "2012", "5", "Complete"); //15
						
			// code to build the tables
			
				// variables
				
					var rowAlt = false;	
					var rowAltStyle = "";
				
				// functions
				
				// add table header
				
					function insertTableHeader(entry, tableName, tableTitleEntry, col1Entry, col2Entry, col3Entry, col4Entry, col5Entry){
					
				// add the table to the DOM
				
						$(entry).append(
							'<div class = "addShadow">' +
								'<table class = "' + tableName + '" id = "addTableBlue">'+
									'<tbody>'+
									// header
										'<tr class = "tableHeader">'+
											'<td colspan="5">' + tableTitleEntry + '</td>'+
										'</tr>'+
										
									// sub header
										'<tr class = "tableContentRow" id = "tableSubHeader">'+
											'<td class = "tableContent">' + col1Entry + '</td>'+
											'<td class = "tableContent">' + col2Entry + '</td>'+
											'<td class = "tableContent">' + col3Entry + '</td>'+
											'<td class = "tableContent">' + col4Entry + '</td>'+
											'<td class = "tableContent">' + col5Entry + '</td>'+
										'</tr>'+
									'</tbody>'+
								'</table>' + 
							'</div>' 
						);
					}
							
				// add row items
				
					function insertTableItem(tableEntry, academyEntry, descriptionEntry, yearEntry, durationEntry, gradeEntry){
					
					// swap the alternating row so it shades differently
					
						if (rowAlt == true){ 
							rowAltStyle = 'id = "altRow"'; 
							rowAlt = false;
						}
						else{ 	
							rowAltStyle = ""; 
							rowAlt = true;
						}
						
					// append the row to the table
					
						$(tableEntry).append(
						'<tr class = "tableContentRow"' + rowAltStyle + '>'+
							'<td class = "tableContent" style = "text-align: center; width: 350px;"><span class = "propagate">' + academyEntry + '</span></td>'+
							'<td class = "tableContent" style = "width: 300px;"><span class = "propagate">' + descriptionEntry + '</span></td>'+
							'<td class = "tableContent" style = "text-align: center;"><span class = "propagate">' + yearEntry + '</span></td>'+
							'<td class = "tableContent" style = "text-align: center;"><span class = "propagate">' + durationEntry + '</span></td>'+
							'<td class = "tableContent" style = "text-align: center;"><span class = "propagate">' + gradeEntry + '</span></td>'+
						'</tr>'																		
						);
					}
				});			
	</script>
	
<!--html-->

	<body>
		<table class="tableContainer">
			<tbody>
			
			<!--row# 1: upper banner-->
			
				<div class = "upperBanner"></div>
				
			<!--row# 2: upper buttons-->	
			
				<div style = "box-shadow: 0px 0px 16px 0px rgba(0,0,0,0.5); width: 900px; text-align: center; margin: auto;">
					<div class = "upperButtons"></div>
				</div>
		
			<!--row# 3: custom content-->
			
				<tr>
					<td colspan="5">					
						<div id = "object" class = "animateDownContainers">
							<div class = "addShadow">
								<div class="infoContainer">
								
								<!--start of custom page content-->
								
									<!--content header-->
									
										<span class="fontBlueBoldTitle">
											<span class='fontSectionHeader'>CORPORATE TRAINING:</span>
										</span>
										
										<br><br>
										
									<!--table# 1-->
									
										<div class = "tableContainer1"></div>
										
								<!--end of custom page content-->
								
								</div>
							<div class = "lowerBanner"></div>
							</div>
							<div class = "footnote"></div>	
						</div>
					</td>
				</tr>
			</tbody>
		</table>
	</body>
</html>
