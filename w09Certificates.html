	<!--Tab title-->
		<title>Certificates</title>
		
	<!--Imported libraries-->
		<head>
			<link rel="shortcut icon" href="images/webSprites/i65TabIcon.ico">
			<link rel="stylesheet" href="stylesheets/s01Main.css"><!--Imported main stylesheet-->
			<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css"><!--Imported icons-->
			<link href="https://fonts.googleapis.com/css?family=Bungee+Inline|Droid+Sans+Mono|Chewy|Faster+One|Hanalei+Fill|Monofett|Oswald|Permanent+Marker|Slackey|Roboto" rel="stylesheet"><!--Imported fonts-->
			<!--http://www.w3schools.com/icons/icons_reference.asp icon reference-->
		</head>
		
	<!--CSS-->
		<style>
		</style>
	
	<!--javascript-->
		<script src='javascript/j01JQuery311.js'></script>
	    <script src="javascript/j03UpperBanner.js"></script>
		<script src="javascript/j04UpperButtons.js"></script>
		<script src="javascript/j05LowerBanner.js"></script>
		<script src="javascript/j06Footnote.js"></script>
		
	<!--page script-->
		<script>
			$('document').ready(function(){
				//Table invokes

					// table# 1 (don't forget to include inside <body>)
						//Header
							insertTableHeader(".tableContainer1", "table1", "Software (AI) Certificates", "Academy", "Description", "Year", "Duration (days)", "Certificate");
						//Rows
							insertTableItem(".table1", "freeCodeCamps", "Python", "2026", "60", "i96PythonCertificate"); //1
				
					// table# 2 (don't forget to include inside <body>)
						//Header
							insertTableHeader(".tableContainer2", "table2", "Software (Full Stack) Certificates", "Academy", "Description", "Year", "Duration (days)", "Certificate");
						//Rows
							insertTableItem(".table2", "freeCodeCamps", "Front-End Web Development", "2017", "100", "i94FrontendWebCertificate"); //1
							insertTableItem(".table2", "freeCodeCamps", "Data-Visualization Web Development", "2017", "40", "i95FrontendDataVisCertificate"); //2
			
					// table# 3 (don't forget to include inside <body>)
						//Header
							insertTableHeader(".tableContainer3", "table3", "Mechatronics Engineering Certificates", "Institute", "Description", "Year", "Duration (days)", "Certificate");
						//Rows
							insertTableItem(".table3", "CSU", "Intro to Visual Basic Programming", "2004", "5", "i97VisualBasicCertificate"); //1
							insertTableItem(".table3", "CSU", "Intro to Robotic Transportation Design", "2004", "5", "i98RoboticTransportationCertificate"); //2
							insertTableItem(".table3", "CSU", "Intro to SolidWorks and 3D Printing", "2003", "5", "i99SolidworksCertificate"); //3
							insertTableItem(".table3", "CSU", "Intro to Fuel Cell Technology", "2003", "5", "i100FuelCellCertificate"); //4
		
				//Standard code to build the tables
					//Variables
						var rowAlt = false;	
						var rowAltStyle = "";
					
					//Functions
						//Add table header
							function insertTableHeader(entry, tableName, tableTitleEntry, col1Entry, col2Entry, col3Entry, col4Entry, col5Entry)
								{
									//Add the table to the DOM
										$(entry).append(
											'<div class = "addShadow">' +
												'<table class = "' + tableName + '" id = "addTableBlue">'+
													'<tbody>'+
														//Header
															'<tr class = "tableHeader">'+
																'<td colspan="5">' + tableTitleEntry + '</td>'+
															'</tr>'+
															
														//Subheader
															'<tr class = "tableContentRow" id = "tableSubHeader">'+
																'<td class = "tableContent">' + col1Entry + '</td>'+
																'<td class = "tableContent">' + col2Entry + '</td>'+
																'<td class = "tableContent">' + col3Entry + '</td>'+
																'<td class = "tableContent">' + col4Entry + '</td>'+
																'<td class = "tableContent">' + col5Entry + '</td>'+
															'</tr>'+
													'</tbody>'+
												'</table>' + 
											'</div>' 
										);
								}//End of insertTableHeader function
								
						//Add row items
							function insertTableItem(tableEntry, academyEntry, descriptionEntry, yearEntry, durationEntry, certEntry)
								{
									//Swap the alternating row so it shades differently
										if (rowAlt == true)
											{ 
												rowAltStyle = 'id = "altRow"'; 
												rowAlt = false;
											}
										else
											{ 	
												rowAltStyle = ""; 
												rowAlt = true;
											}
										
									//Append the row to the table
										$(tableEntry).append(
											'<tr class = "tableContentRow"' + rowAltStyle + '>'+
												'<td class = "tableContent" style = "text-align: center;"><span class = "propagate">' + academyEntry + '</span></td>'+
												'<td class = "tableContent" style = "width: 400px;"><span class = "propagate">' + descriptionEntry + '</span></td>'+
												'<td class = "tableContent" style = "text-align: center;"><span class = "propagate">' + yearEntry + '</span></td>'+
												'<td class = "tableContent" style = "text-align: center;"><span class = "propagate">' + durationEntry + '</span></td>'+
												'<td class = "tableContent" style = "text-align: center;"><span class = "propagate">' 
													+ '<a href="images/certificates/' + certEntry + '.jpg" target="_blank">'
													+ '<i class="fa fa-external-link"></i>'
													+ '</a>'
													+ '</span>'
												+ '</td>'+
											'</tr>'																		
										);
								}//End of insertTableItem function
					});			
		</script>
		
	<!--HTML-->
		<body>
		
			<table class="tableContainer">
				<tbody>
						<!--Row#1: upperBanner-->
							<div class = "upperBanner"></div><!--imported script-->
							
						<!--Row#2: upperButtons-->	
							<div style = "box-shadow: 0px 0px 16px 0px rgba(0,0,0,0.5); width: 900px; text-align: center; margin: auto;">
								<div class = "upperButtons"></div><!--imported script-->
							</div>
					
						<!--Row#3: custom content-->
							<tr>
								<td colspan="5">					
										<div id = "object" class = "animateDownContainers">
											<div class = "addShadow">
												<div class="infoContainer">
													<!--Start of custom page content-->
														<!--Content Header-->
															<span class = "fontBlueBoldTitle">9. <u>Certificates:</u></span>
															<br><br>
														<!--table# 1-->	
															<span class = "fontBlueBoldTitle">
																<span class = "tab1">9.1. <u>Software (AI):</u></span>
															</span>
															<br><br>
																<div class = "tableContainer1"></div>
															<br>	
														<!--table# 2-->	
															<span class = "fontBlueBoldTitle">
																<span class = "tab1">9.2. <u>Software (Full Stack):</u>
																</span>
															</span>
															<br><br>
																<div class = "tableContainer2"></div>
															<br>	
														<!--table# 3-->			
															<span class = "fontBlueBoldTitle">
																<span class = "tab1">9.3. <u>Engineering:</u></span>
															</span>
															<br><br>
															<div class = "tableContainer3"></div>
													<!--End of custom page content-->	
												</div>
											<div class = "lowerBanner"></div><!--imported script-->
											</div>
											<div class = "footnote"></div>	
										</div>
								</td>
							</tr>
				</tbody>
			</table>
		</body>
</html>
