<html>
<!--tab title-->

	<title>Software (AI)</title>
	
<!--imported styles-->

	<head>
		<script src="javascript/j09HeaderImports.js"></script>
	</head>

<!--imported scripts-->

	<script src='javascript/j01JQuery311.js'></script>
	<script src="javascript/j03UpperBanner.js"></script>
	<script src="javascript/j04UpperButtons.js"></script>
	<script src="javascript/j05LowerBanner.js"></script>
	<script src="javascript/j06Footnote.js"></script>
	
<!--page script-->

	<script>
	
	// generates the tables
	
	$('document').ready(function(){
	
	// header
	
		insertTableHeader(".tableContainer01", "table01", "Relevant Software Experience");

	// languages
	
		// sub header
		
			insertSubHeader(".table01", "Languages");
			
		// col header
		
			insertColHeader(".table01", "Name", "Application", "Start Year", "Proficiency");
			
		// rows
		
			insertTableItem(".table01", "Python", "Custom Chat Bots", "2026", "Intermediate");
			insertTableItem(".table01", "OpenAI", "Custom Chat Bots", "2026", "Beginner");
			insertTableItem(".table01", "PyTorch", "Data Analytics", "2026", "Beginner");

	// prompt tools
	
		// sub header
		
			insertSubHeader(".table01", "Prompt Tools");

		// col header
		
			insertColHeader(".table01", "Name", "Application", "Start Year", "Proficiency");

		// rows
		
			insertTableItem(".table01", "ChatGPT", "External Dev Assistance", "2023", "Intermediate");
			insertTableItem(".table01", "Claude Code", "Integrated Dev Assistance", "2025", "Intermediate");
			insertTableItem(".table01", "SourceGraph", "Integrated Dev Assistance", "2025", "Beginner");
			insertTableItem(".table01", "Cody", "Integrated Dev Assistance", "2025", "Beginner");

		// footer
		
			insertLowerLegend(".table01");	

		// standard code to build the tables
		
		// variables
			var rowAlt = false;	
			var rowAltStyle = "";
			
		// functions
		
			// get year duration
			
				function getYearDuration(start){
					let now = new Date();
					let duration = now.getFullYear() - parseInt(start);
					return `${start} (${duration == 0 ? '< 1 yr' : duration + ' yrs'})`;
				}
				
			// insert table header
			
				function insertTableHeader(containerEntry, tableEntry, tableTitleEntry){
					$(containerEntry).append(
						'<div class = "addShadow">' +
							'<table class = "' + tableEntry + '" id = "addTableBlue">'+
								'<tbody>'+
									'<tr class = "tableHeader">'+
										'<td colspan="5">' + tableTitleEntry + '</td>'+
									'</tr>'+
								'</tbody>'+
							'</table>' + 
						'</div>' 
					);
				}
					
			// insert table header
			
				function insertSubHeader(tableEntry, titleEntry){
				
				// add the table to the DOM
				
					$(tableEntry).append(
					
					// sub header
					
						'<tr class="tableSub">'+
							'<td colspan="5">' + titleEntry + '</td>'+
						'</tr>'
					);
				}
					
			// insert insertColHeader
			
				function insertColHeader(tableEntry, col1Entry, col2Entry, col3Entry, col4Entry){
				
					// add the table to the DOM
					
						$(tableEntry).append(
						
							// sub header
							
								'<tr class = "tableContentRow" id = "tableSubHeader">'+
									'<td class = "tableContent">' + col1Entry + '</td>'+
									'<td class = "tableContent">' + col2Entry + '</td>'+
									'<td class = "tableContent">' + col3Entry + '</td>'+
									'<td class = "tableContent">' + col4Entry + '</td>'+
								'</tr>'
						);
				}
					
			// add row items
			
				function insertTableItem(tableEntry, col1Entry, col2Entry, col3Entry, col4Entry){
				
				// swap the alternnating row so it shades differently
				
					if (rowAlt == true){ 
						rowAltStyle = 'id = "altRow"'; 
						rowAlt = false;
					}
					else{ 	
						rowAltStyle = ""; 
						rowAlt = true;
					}
						
				// convert the rating
				
					let rating = `&#11088;`;
					if(col4Entry == `Expert`){
						rating = `&#11088; &#11088; &#11088;`;
					}else if(col4Entry == `Intermediate`){
						rating = `&#11088; &#11088;`
					}
					
				// append the row to the table
				
					$(tableEntry).append(
						'<tr class = "tableContentRow"' + rowAltStyle + '>'+
							'<td class = "tableContent" style = "7width: 300px;"><span class = "propagate">' + col1Entry + '</span></td>'+
							'<td class = "tableContent" style = "width: 300px;"><span class = "propagate">' + col2Entry + '</span></td>'+
							'<td class = "tableContent" style = "text-align: center;"><span class = "propagate">' + getYearDuration(col3Entry) + '</span></td>'+
							'<td class = "tableContent" style = "text-align: center;"><span class = "propagate" style="font-style: normal !important;">' + rating + '</span></td>'+
						'</tr>'																		
					);
				}
					
			// add the lower legend
			
				function insertLowerLegend(tableEntry){
					$(tableEntry).append(
					'<tr class = "tableContentRow">'+
						'<td colspan="4" class = "tableContent" style = "text-align: center; background-color: #4975AA; color: white;"><span class = "propagate"><strong>Proficiency Notes (Time Spent):</strong> <span style="font-style: normal !important;">&#11088;</span> = 10hrs - 50hrs  <span style="font-style: normal !important;">&#11088;&#11088;</span> = 50hrs - 200hrs  <span style="font-style: normal !important;">&#11088;&#11088;&#11088;</span>(can train) = 200+ hrs</span></td>'+
						'</tr>'																		
					);
				}
		});
	</script>
	
<!--html-->

	<body>
		<table class="tableContainer">
			<tbody>
			
			<!--row# 1: upper banner-->
			
				<div class = "upperBanner"></div>
				
			<!--row# 2: upper buttons-->
			
				<div style = "box-shadow: 0px 0px 16px 0px rgba(0,0,0,0.5); width: 900px; text-align: center; margin: auto;">
					<div class = "upperButtons"></div>
				</div>
				
			<!--row# 3: custom content-->
			
				<tr>
					<td colspan="5">					
						<div class = "animateDownContainers">
							<div class = "addShadow">
								<div class="infoContainer">
								
								<!--content header-->
								
									<span class='fontSectionHeader'>SOFTWARE (AI):</span>
									
									<br><br>
									
								<!--software table-->
								
									<span class='fontSectionHeader tab1'>RELEVANT SOFTWARE:</span>
									
									<br><br>
									
									<div class = "tableContainer01"></div>
									
								</div>
								<div class = "lowerBanner"></div>
							</div>
							<div class = "footnote"></div>
						</div>
					</td>
				</tr>
			</tbody>
		</table>
	</body>
</html>
