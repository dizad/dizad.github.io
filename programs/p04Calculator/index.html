<!DOCTYPE html>
<html >
<head>
  <meta charset="UTF-8">
  <title>FCC#07: Calculator</title>
      <link rel="stylesheet" href="css/style.css">
</head>

<body>
  <link href="https://fonts.googleapis.com/css?family=Bungee+Inline|Droid+Sans+Mono|Faster+One|Hanalei+Fill|Monofett|Oswald|Permanent+Marker|Slackey|Fira+Mono|Barrio" rel="stylesheet"> <!--Custom fonts-->
<div class = "fontSubTitle">The Waki Taki!?@:</div>
<div class = "fontTitle">FLEXI Calc:</div>
 <!--keypad-->
    <table>
      <tbody>
        <tr>
          <td colspan="4" id = "screen" class = "fontScreen">[clear]</td><!--Screen-->
        </tr>
         <tr>
          <td class = "butDefault" colspan="4" id = "butClear" style = " transform: rotate(0deg);">CLEAR</td><!--Screen-->
        </tr>
        <tr>
          <td class = "butDefault operator" id = "butPlus">+</td>
          <td class = "butDefault operator" id = "butMinus">-</td>
          <td class = "butDefault operator" id = "butDivide" style = " transform: rotate(-2deg);">/</td>
          <td class = "butDefault operator" id = "butMultiply">X</td>
        </tr>
        <tr>
          <td class = "butDefault numerical" id = "butSeven">7</td>
          <td class = "butDefault numerical" id = "butEight" style = " transform: rotate(-3deg);">8</td>
          <td class = "butDefault numerical" id = "butNine">9</td>
          <td rowspan="4" class = "butDefault" id = "butEqual">=</td>
        </tr>
        <tr>
          <td class = "butDefault numerical" id = "butFour" style = " transform: rotate(-3deg);">4</td>
          <td class = "butDefault numerical" id = "butFive">5</td>
          <td class = "butDefault numerical" id = "butSix">6</td>
        </tr>
        <tr>
          <td class = "butDefault numerical" id = "butOne">1</td>
          <td class = "butDefault numerical" id = "butTwo">2</td>
          <td class = "butDefault numerical" id = "butThree" style = " transform: rotate(-1deg);">3</td>
        </tr>
        <tr>
          <td colspan="2" class = "butDefault numerical" id = "butZero" style = " transform: rotate(-4deg);">0</td>
          <td class = "butDefault numerical" id = "butDot">.</td>
        </tr>
      </tbody>
    </table>

<div class = "fontLog"><strong><em>[FCC Project#07: Calculator] </em></strong></div>
<div class = "fontLog"><strong><em>Exercise Topic(s): Javascript</em></strong></div>
<div class = "fontLog"><strong><em>Coded by: DIZAD 03/03/17</em></strong></div>
  <script src='https://cdnjs.cloudflare.com/ajax/libs/jquery/3.1.0/jquery.min.js'></script>
<script src='https://cdnjs.cloudflare.com/ajax/libs/jqueryui/1.12.0/jquery-ui.min.js'></script>

    <script src="js/index.js"></script>

</body>
</html>
