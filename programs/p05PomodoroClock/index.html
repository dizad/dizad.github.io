<!DOCTYPE html>
<html >
<head>
  <meta charset="UTF-8">
  <title>FCC#08: Pomodoro Clock</title>
  
  
  
      <link rel="stylesheet" href="css/style.css">

  
</head>

<body>
	<link href="https://fonts.googleapis.com/css?family=Bungee+Inline|Droid+Sans+Mono|Faster+One|Hanalei+Fill|Monofett|Oswald|Permanent+Marker|Slackey|Fira+Mono|Coda+Caption:800" rel="stylesheet"> 
<!--fonts-->
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css"><!--Imported icons-->

<!--Title block -->
  <div class = "honeycomb">
      <div class = "fontTitle">Pomodoro</div><div class = "fontTitle">Clock <i class = "fa fa-clock-o"> = </i><span id = "screenCountdown"> 0 : 0</span></div>
        <!--Main container-->  
          <div class = "mainContainer">
          <div class = "butDefault" id = "butStop">STOP/GO</div>  
          <div class = "butDefault" id = "butStart">START</div>
          <div id = "container1">
          <div class = "timeRing"></div>
        <!--Break operators-->
          <div class = "butAdjust" id = "butPlusTimer">+</div>
          <div class = "butAdjust" id = "butMinusTimer">-</div>
        <!--Break operators-->
          <div class = "butAdjust" id = "butPlusBreak">+</div>
          <div class = "butAdjust" id = "butMinusBreak">-</div>
          <div class = "screen" id = "screenTimer">1</div>
          <div class = "screen" id= "screenBreak">1</div>
        </div> 
    </div>
<!--footNote -->
  <hr style="visibility:hidden;" />
  <div class = "fontFootNote"><em>[FCC Project#08: Pomodoro Clock] </em></div>

</div>
